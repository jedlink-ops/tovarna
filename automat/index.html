<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">

<title>Ovocný Respin 81</title>
<style>
  :root { --gold: #ffd166; --gold2: #e8a317; --red: #d6283a; --bg: #1a0710; --panel: #2b0d1a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { margin: 0; height: 100%; background: radial-gradient(120% 80% at 50% 0%, #4a0f26 0%, #1a0710 60%, #0d0408 100%); color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #app { max-width: 460px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; padding: calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom)); gap: 10px; }
  h1 { margin: 0; text-align: center; font-size: 22px; letter-spacing: 1px; color: var(--gold); text-shadow: 0 2px 0 #7a4a00, 0 0 18px #ff9f1c88; }
  h1 small { display: block; font-size: 11px; color: #ffffff88; letter-spacing: 2px; font-weight: 600; text-shadow: none; }
  .hud { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .box { background: linear-gradient(#3b1226, #260a17); border: 2px solid #7a4a00; border-radius: 12px; padding: 6px 8px; text-align: center; box-shadow: inset 0 0 12px #0008; }
  .box span { display: block; font-size: 10px; letter-spacing: 1.5px; color: #ffd16699; font-weight: 700; }
  .box b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; color: #fff; }
  #winBox b { color: var(--gold); }
  #winBox.hot { animation: pulse .5s infinite alternate; }
  @keyframes pulse { from { box-shadow: 0 0 6px #ffd166; } to { box-shadow: 0 0 22px #ffb300, inset 0 0 12px #ffd16666; } }
  .frame { position: relative; padding: 8px; border-radius: 20px; background: linear-gradient(145deg, #ffe08a, #b97a10 55%, #ffd166); box-shadow: 0 10px 30px #000a, inset 0 0 8px #fff8; }
  canvas { display: block; width: 100%; border-radius: 13px; background: #14050c; touch-action: manipulation; }
  #msg { min-height: 40px; text-align: center; font-weight: 700; color: var(--gold); font-size: 15px; text-shadow: 0 1px 0 #000; }
  .ctrl { display: grid; grid-template-columns: 1fr 1.5fr 1fr; gap: 8px; align-items: stretch; }
  button { font: inherit; color: #fff; border: 0; border-radius: 14px; padding: 10px 6px; font-weight: 800; background: linear-gradient(#5b2a43, #3a1427); border: 2px solid #7a4a00; box-shadow: 0 4px 0 #1a0710; cursor: pointer; }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #1a0710; }
  button:disabled { opacity: .45; }
  button small { display: block; font-size: 10px; font-weight: 600; opacity: .7; letter-spacing: 1px; }
  #spin { grid-row: span 2; font-size: 24px; background: radial-gradient(circle at 50% 30%, #4ee06a, #14912e); border-color: #b9ffc7; border-radius: 22px; box-shadow: 0 6px 0 #0a5a1b, 0 0 20px #4ee06a55; }
  #spin:active { box-shadow: 0 2px 0 #0a5a1b; transform: translateY(4px); }
  #spin.stop { background: radial-gradient(circle at 50% 30%, #ff8a7a, #c4261a); border-color: #ffd0c8; box-shadow: 0 6px 0 #6a120a; }
  #gambleBtn { background: linear-gradient(#e4415a, #9a1428); border-color: #ffb3bd; }
  #collectBtn { background: linear-gradient(#ffd166, #d38b05); color: #3a2400; border-color: #fff0b8; }
  #auto.on { background: linear-gradient(#4ee06a, #14912e); }
  .row2 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .bet { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .bet button { width: 44px; padding: 8px 0; font-size: 20px; }
  .bet div { flex: 1; text-align: center; }
  .bet b { font-size: 18px; }
  .bet small { font-size: 10px; opacity: .6; letter-spacing: 1.5px; }
  .foot { text-align: center; font-size: 10px; color: #ffffff55; line-height: 1.4; }
  #overlay { position: fixed; inset: 0; background: #000c; display: none; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
  #overlay.show { display: flex; }
  #card { background: linear-gradient(#3b1226, #1c0710); border: 3px solid var(--gold2); border-radius: 18px; padding: 16px; max-width: 420px; width: 100%; max-height: 90vh; overflow: auto; text-align: center; box-shadow: 0 0 40px #ffb30055; }
  #card h2 { margin: 0 0 8px; color: var(--gold); }
  #card table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 14px; }
  #card td, #card th { padding: 5px 4px; border-bottom: 1px solid #ffffff1a; }
  #card th { color: #ffd16699; font-size: 11px; letter-spacing: 1px; }
  #card p { font-size: 13px; line-height: 1.45; color: #ffffffcc; text-align: left; margin: 6px 0; }
  #card button { margin-top: 10px; width: 100%; }
  .cards { display: flex; gap: 10px; justify-content: center; margin: 10px 0; }
  .pcard { width: 92px; height: 128px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 52px; background: #fff; color: #222; border: 3px solid var(--gold); box-shadow: 0 4px 14px #000a; }
  .pcard.back { background: repeating-linear-gradient(45deg, #b3122a, #b3122a 8px, #7a0c1d 8px, #7a0c1d 16px); color: #ffd166; }
  .pcard.red { color: #d6283a; } .pcard.blk { color: #111; }

  .gbtns .r { background: linear-gradient(#e4415a, #9a1428); } .gbtns .b { background: linear-gradient(#444, #111); }
  .hist { display: flex; gap: 6px; justify-content: center; min-height: 24px; font-size: 18px; }
</style>

<body>
<div id="app">
  <h1>🍒 OVOCNÝ RESPIN 81 🃏<small>81 VÝHERNÍCH CEST · JOKER RESPIN · RIZIKO</small></h1>
  <div class="hud">
    <div class="box"><span>KREDIT</span><b id="credit">0</b></div>
    <div class="box"><span>STÁVKA</span><b id="betv">0</b></div>
    <div class="box" id="winBox"><span>VÝHRA</span><b id="winv">0</b></div>
  </div>
  <div class="frame"><canvas id="cv"></canvas></div>
  <div id="msg"> </div>
  <div class="ctrl">

    <button id="fast">⚡ RYCHLE<small>vyp</small></button>

    <button id="info">ℹ️ PRAVIDLA</button>
  </div>

</div>
<div id="overlay"><div id="card"></div></div>

<script>
(() => {
'use strict';
// ===================== LOGIKA (čistá, testovatelná) =====================
// LOGIC START
const COLS = 4, ROWS = 3;
const SYMS = [
  { id: 'cherry', e: '🍒', w: 22, p: [0.05, 0.15] },
  { id: 'lemon',  e: '🍋', w: 22, p: [0.05, 0.15] },
  { id: 'orange', e: '🍊', w: 18, p: [0.08, 0.25] },
  { id: 'grape',  e: '🍇', w: 16, p: [0.08, 0.25] },
  { id: 'melon',  e: '🍉', w: 12, p: [0.12, 0.40] },
  { id: 'star',   e: '⭐', w: 8,  p: [0.25, 0.80] },
  { id: 'seven',  e: '7️⃣', w: 5,  p: [0.50, 2.00] },
  { id: 'joker',  e: '🃏', w: 2,  p: null },
];
const JOKER = 7, MAX_RESPINS = 3;
const TOTAL_W = SYMS.reduce((a, s) => a + s.w, 0);
function pickSym(rnd) { let r = rnd() * TOTAL_W; for (let i = 0; i < SYMS.length; i++) { r -= SYMS[i].w; if (r < 0) return i; } return 0; }
function pickReel(rnd) { return [pickSym(rnd), pickSym(rnd), pickSym(rnd)]; }
// grid[r] = [řádek0, řádek1, řádek2]; locked[r] = true => celý válec je wild joker
function evaluate(grid, locked, bet) {
  let total = 0; const wins = [], cells = new Set();
  for (let s = 0; s < JOKER; s++) {
    const cnt = [];
    for (let r = 0; r < COLS; r++) { let c = 0; if (locked[r]) c = ROWS; else for (let k = 0; k < ROWS; k++) if (grid[r][k] === s || grid[r][k] === JOKER) c++; cnt.push(c); }
    let n = 0, ways = 1;
    while (n < COLS && cnt[n] > 0) { ways *= cnt[n]; n++; }
    if (n >= 3) {
      const amt = Math.max(1, Math.round(bet * SYMS[s].p[n - 3] * ways * PAYSCALE));
      total += amt; wins.push({ s, n, ways, amt });
      for (let r = 0; r < n; r++) for (let k = 0; k < ROWS; k++) if (locked[r] || grid[r][k] === s || grid[r][k] === JOKER) cells.add(r + ',' + k);
    }
  }
  return { total, wins, cells };
}
const PAYSCALE = 1.2;
// jedno celé kolo včetně respinů (pro simulaci RTP)
function playRound(rnd, bet) {
  const grid = [], locked = [false, false, false, false];
  for (let r = 0; r < COLS; r++) grid.push(pickReel(rnd));
  let respins = 0;
  for (;;) {
    let added = false;
    for (let r = 0; r < COLS; r++) if (!locked[r] && grid[r].includes(JOKER)) { locked[r] = true; added = true; }
    if (!added || respins >= MAX_RESPINS || locked.every(Boolean)) break;
    respins++;
    for (let r = 0; r < COLS; r++) if (!locked[r]) grid[r] = pickReel(rnd);
  }
  return { grid, locked, respins, ...evaluate(grid, locked, bet) };
}
// LOGIC END

if (typeof window === 'undefined') { module.exports = { playRound, SYMS, evaluate }; return; }

// ===================== STAV =====================
const BETS = [10, 20, 50, 100, 200, 500];
const $ = id => document.getElementById(id);
const S = { credit: 5000, bet: 20, win: 0, pending: 0, auto: false, fast: false, sound: true, state: 'idle', respins: 0, gambleSteps: 0, big: 0 };
try { const d = JSON.parse(localStorage.getItem('automat81') || 'null'); if (d) { S.credit = d.credit; S.bet = BETS.includes(d.bet) ? d.bet : 20; S.sound = d.sound !== false; S.fast = !!d.fast; } } catch (e) {}
function save() { try { localStorage.setItem('automat81', JSON.stringify({ credit: S.credit, bet: S.bet, sound: S.sound, fast: S.fast })); } catch (e) {} }

// ===================== ZVUK =====================
let AC = null;
function tone(f, d, type, vol, when) {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime + (when || 0), o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(vol || 0.08, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + 0.02);
  } catch (e) {}
}
const sfx = {
  tick: () => tone(180, 0.07, 'square', 0.05),
  stop: r => { tone(260 + r * 40, 0.09, 'triangle', 0.1); },
  win: n => { for (let i = 0; i < Math.min(8, 3 + n); i++) tone(520 * Math.pow(1.122, i * 2), 0.18, 'triangle', 0.09, i * 0.08); },
  big: () => { for (let i = 0; i < 12; i++) tone(440 * Math.pow(1.0595, [0, 4, 7, 12][i % 4] + (i / 4 | 0) * 2), 0.22, 'square', 0.06, i * 0.09); },
  joker: () => { tone(880, 0.12, 'sawtooth', 0.07); tone(1175, 0.2, 'sawtooth', 0.07, 0.1); tone(1568, 0.3, 'sawtooth', 0.07, 0.2); },
  lose: () => tone(150, 0.25, 'sawtooth', 0.07),
  btn: () => tone(420, 0.05, 'triangle', 0.06),
};

// ===================== VÁLCE A KRESLENÍ =====================
const cv = $('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, cw = 0, PAD = 8, GAP = 6, dpr = 1;
function resize() {
  const w = cv.parentElement.clientWidth - 16; dpr = Math.min(3, window.devicePixelRatio || 1);
  cw = (w - PAD * 2 - GAP * (COLS - 1)) / COLS; W = w; H = ROWS * cw + PAD * 2;
  cv.style.height = H + 'px'; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  if (typeof makeSprites === 'function' && typeof SPRITES !== 'undefined') makeSprites();
}

// ===================== VEKTOROVÉ SYMBOLY (bez emoji fontu – funguje všude) =====================
const SPR = [];
function ball(g, x, y, r, c1, c2) {
  const gr = g.createRadialGradient(x - r * .35, y - r * .4, r * .1, x, y, r); gr.addColorStop(0, c1); gr.addColorStop(1, c2);
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 6.3); g.fill();
  g.fillStyle = 'rgba(255,255,255,.55)'; g.beginPath(); g.ellipse(x - r * .4, y - r * .45, r * .24, r * .13, -.7, 0, 6.3); g.fill();
}
function leaf(g, x, y, dx, dy, col) { g.fillStyle = col || '#4caf3a'; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + dx * .7, y - dy, x + dx, y + dy * .1); g.quadraticCurveTo(x + dx * .3, y + dy * .5, x, y); g.fill(); }
const SPRITES = {
  cherry(g) {
    g.strokeStyle = '#5a8a2a'; g.lineWidth = 3.5; g.lineCap = 'round'; g.beginPath(); g.moveTo(30, 66); g.quadraticCurveTo(38, 34, 62, 14); g.moveTo(68, 70); g.quadraticCurveTo(66, 36, 62, 14); g.stroke();
    leaf(g, 62, 14, 28, 14); ball(g, 30, 70, 20, '#ff6a7e', '#b0102a'); ball(g, 69, 74, 20, '#ff6a7e', '#b0102a');
  },
  lemon(g) {
    g.save(); g.translate(50, 54); g.rotate(-.4);
    const gr = g.createLinearGradient(0, -28, 0, 28); gr.addColorStop(0, '#fff06a'); gr.addColorStop(1, '#e6b400');
    g.fillStyle = gr; g.strokeStyle = '#b58a00'; g.lineWidth = 2.5; g.beginPath(); g.moveTo(-44, 0); g.quadraticCurveTo(-32, -32, 0, -29); g.quadraticCurveTo(32, -32, 44, 0); g.quadraticCurveTo(32, 32, 0, 29); g.quadraticCurveTo(-32, 32, -44, 0); g.fill(); g.stroke();
    g.fillStyle = 'rgba(255,255,255,.6)'; g.beginPath(); g.ellipse(-12, -14, 14, 5, -.2, 0, 6.3); g.fill(); g.restore();
    leaf(g, 76, 40, 18, 14);
  },
  orange(g) {
    ball(g, 50, 58, 34, '#ffc062', '#e2640a');
    g.fillStyle = 'rgba(160,60,0,.25)'; for (const [x, y] of [[36, 62], [54, 72], [62, 52], [44, 48], [68, 66], [30, 50]]) { g.beginPath(); g.arc(x, y, 1.6, 0, 6.3); g.fill(); }
    g.strokeStyle = '#6a4a1a'; g.lineWidth = 3; g.lineCap = 'round'; g.beginPath(); g.moveTo(50, 26); g.lineTo(50, 18); g.stroke(); leaf(g, 51, 22, 26, 14);
  },
  grape(g) {
    g.strokeStyle = '#6a4a1a'; g.lineWidth = 3.5; g.lineCap = 'round'; g.beginPath(); g.moveTo(50, 24); g.lineTo(52, 10); g.stroke(); leaf(g, 52, 12, 30, 14);
    for (const [x, y] of [[28, 38], [50, 36], [72, 38], [38, 56], [62, 56], [50, 76]]) ball(g, x, y, 14, '#c49af8', '#5a2a9a');
    ball(g, 50, 56, 14, '#c49af8', '#5a2a9a'); ball(g, 50, 76, 13, '#c49af8', '#5a2a9a');
  },
  melon(g) {
    g.save(); g.translate(50, 34);
    g.fillStyle = '#2e9a3a'; g.beginPath(); g.arc(0, 0, 47, 0, Math.PI); g.closePath(); g.fill();
    g.fillStyle = '#eef8c8'; g.beginPath(); g.arc(0, 0, 41, 0, Math.PI); g.closePath(); g.fill();
    const gr = g.createLinearGradient(0, 0, 0, 38); gr.addColorStop(0, '#ff6a7a'); gr.addColorStop(1, '#e02a44'); g.fillStyle = gr; g.beginPath(); g.arc(0, 0, 36, 0, Math.PI); g.closePath(); g.fill();
    g.fillStyle = '#2a1a1a'; for (const [x, y, a] of [[-18, 14, .5], [0, 22, 0], [18, 14, -.5], [-8, 8, .3], [10, 9, -.3], [-26, 5, .8], [26, 5, -.8]]) { g.save(); g.translate(x, y); g.rotate(a); g.beginPath(); g.ellipse(0, 0, 2.6, 4.2, 0, 0, 6.3); g.fill(); g.restore(); }
    g.restore();
  },
  star(g) {
    g.save(); g.translate(50, 54); g.beginPath();
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 19 : 44; g.lineTo(Math.cos(a) * r, Math.sin(a) * r); } g.closePath();
    const gr = g.createLinearGradient(0, -44, 0, 40); gr.addColorStop(0, '#fff3a0'); gr.addColorStop(1, '#f5a500'); g.fillStyle = gr; g.strokeStyle = '#c77b00'; g.lineWidth = 4; g.lineJoin = 'round'; g.fill(); g.stroke();
    g.fillStyle = 'rgba(255,255,255,.55)'; g.beginPath(); g.ellipse(-8, -14, 9, 4, -.9, 0, 6.3); g.fill(); g.restore();
  },
  seven(g) {
    g.font = '900 92px "Arial Black", Impact, Helvetica, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.lineJoin = 'round';
    g.lineWidth = 12; g.strokeStyle = '#5a0a14'; g.strokeText('7', 50, 82);
    g.lineWidth = 5; g.strokeStyle = '#ffd166'; g.strokeText('7', 50, 82);
    const gr = g.createLinearGradient(0, 10, 0, 82); gr.addColorStop(0, '#ff6a7a'); gr.addColorStop(1, '#c4101e'); g.fillStyle = gr; g.fillText('7', 50, 82);
  },
  joker(g) {
    g.fillStyle = '#fffdf4'; g.strokeStyle = '#8a7a50'; g.lineWidth = 2.5; rrG(g, 15, 5, 70, 90, 9); g.fill(); g.stroke();
    g.fillStyle = '#e4415a'; g.beginPath(); g.moveTo(25, 46); g.quadraticCurveTo(14, 28, 24, 15); g.lineTo(44, 40); g.fill();
    g.fillStyle = '#3a8fe8'; g.beginPath(); g.moveTo(75, 46); g.quadraticCurveTo(86, 28, 76, 15); g.lineTo(56, 40); g.fill();
    g.fillStyle = '#ffc93a'; g.beginPath(); g.moveTo(36, 42); g.quadraticCurveTo(44, 22, 50, 10); g.quadraticCurveTo(56, 22, 64, 42); g.fill();
    g.fillStyle = '#7a3ac0'; g.fillRect(27, 40, 46, 9);
    g.fillStyle = '#ffd166'; for (const [x, y] of [[24, 14], [50, 9], [76, 14]]) { g.beginPath(); g.arc(x, y, 5, 0, 6.3); g.fill(); }
    g.fillStyle = '#ffd9b0'; g.beginPath(); g.arc(50, 62, 15, 0, 6.3); g.fill();
    g.fillStyle = '#222'; g.beginPath(); g.arc(44, 59, 1.9, 0, 6.3); g.arc(56, 59, 1.9, 0, 6.3); g.fill();
    g.strokeStyle = '#c4102a'; g.lineWidth = 2.4; g.lineCap = 'round'; g.beginPath(); g.arc(50, 63, 7, .2, Math.PI - .2); g.stroke();
    g.fillStyle = '#e4415a'; g.beginPath(); g.arc(40, 66, 3, 0, 6.3); g.arc(60, 66, 3, 0, 6.3); g.globalAlpha = .45; g.fill(); g.globalAlpha = 1;
    g.fillStyle = '#7a3ac0'; g.beginPath(); for (let i = 0; i < 6; i++) { g.lineTo(26 + i * 9.6, 80); g.lineTo(31 + i * 9.6, 90); } g.lineTo(80, 80); g.fill();
  },
};
function rrG(g, x, y, w, h, r) { g.beginPath(); if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h); }
function makeSprites() {
  const Sz = Math.max(16, Math.round(cw * dpr));
  SYMS.forEach((sy, i) => { const c = document.createElement('canvas'); c.width = c.height = Sz; const g = c.getContext('2d'); g.scale(Sz / 100, Sz / 100); SPRITES[sy.id](g); SPR[i] = c; });
}
const reels = [];
for (let r = 0; r < COLS; r++) {
  const m = new Map(); const R = { off: 0, from: 0, to: 0, t0: 0, dur: 0, spinning: false, locked: false, map: m, stopped: true, lastTick: 0 };
  for (let k = 0; k < ROWS; k++) m.set(k, pickSym(Math.random));
  reels.push(R);
}
function symAt(R, k) { let v = R.map.get(k); if (v === undefined) { v = pickSym(Math.random); R.map.set(k, v); if (R.map.size > 400) { for (const key of R.map.keys()) { if (Math.abs(key - R.off) > 60) R.map.delete(key); } } } return v; }
let winCells = new Set(), shake = 0, flash = 0, banner = null;
const parts = [];
const FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const easeOut = p => { const c = 1.25; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };

function reelX(r) { return PAD + r * (cw + GAP); }
function draw(now) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#2a0b18'); g.addColorStop(1, '#120409'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const sx = shake > 0 ? (Math.random() - 0.5) * shake * 6 : 0, sy = shake > 0 ? (Math.random() - 0.5) * shake * 6 : 0;
  ctx.save(); ctx.translate(sx, sy);
  for (let r = 0; r < COLS; r++) {
    const R = reels[r], x = reelX(r);
    ctx.save(); ctx.beginPath(); rr(x, PAD, cw, ROWS * cw, 10); ctx.clip();
    const bg = ctx.createLinearGradient(0, PAD, 0, PAD + ROWS * cw); bg.addColorStop(0, '#f8efe0'); bg.addColorStop(0.5, '#fffaf0'); bg.addColorStop(1, '#eadcc2');
    ctx.fillStyle = R.locked ? '#4a1860' : bg; ctx.fillRect(x, PAD, cw, ROWS * cw);
    if (R.locked) { const lg = ctx.createRadialGradient(x + cw / 2, PAD + ROWS * cw / 2, 5, x + cw / 2, PAD + ROWS * cw / 2, cw * 1.6); lg.addColorStop(0, '#d98cff'); lg.addColorStop(1, '#3a0d52'); ctx.fillStyle = lg; ctx.fillRect(x, PAD, cw, ROWS * cw); }
    ctx.font = `${cw * 0.62}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const base = Math.floor(R.off) - 1, fast = R.spinning;
    for (let k = base; k <= base + ROWS + 2; k++) {
      const y = PAD + (k - R.off) * cw + cw / 2;
      if (y < PAD - cw || y > PAD + (ROWS + 1) * cw) continue;
      const row = k - Math.round(R.off); const inVis = !R.spinning && row >= 0 && row < ROWS;
      const sym = R.locked ? JOKER : symAt(R, k);
      const win = inVis && winCells.has(r + ',' + row);
      ctx.globalAlpha = fast ? 0.82 : 1;
      let sc = 1; if (win) sc = 1 + 0.09 * Math.sin(now / 130 + r);
      ctx.save(); ctx.translate(x + cw / 2, y); ctx.scale(sc, sc);
      if (fast) ctx.scale(1, 1.18);
      ctx.drawImage(SPR[sym], -cw * 0.5, -cw * 0.5, cw, cw); ctx.restore(); ctx.globalAlpha = 1;
    }
    if (R.spinning) { const sh = ctx.createLinearGradient(0, PAD, 0, PAD + ROWS * cw); sh.addColorStop(0, '#0006'); sh.addColorStop(0.25, '#0000'); sh.addColorStop(0.75, '#0000'); sh.addColorStop(1, '#0006'); ctx.fillStyle = sh; ctx.fillRect(x, PAD, cw, ROWS * cw); }
    ctx.restore();
    if (R.locked) { ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 3; rr(x, PAD, cw, ROWS * cw, 10); ctx.stroke(); ctx.fillStyle = '#ffd166'; ctx.font = `800 ${cw * 0.13}px sans-serif`; ctx.fillText('WILD', x + cw / 2, PAD + ROWS * cw - cw * 0.1); }
    // rámečky výherních políček
    for (let k = 0; k < ROWS; k++) if (!R.spinning && winCells.has(r + ',' + k)) {
      const a = 0.55 + 0.45 * Math.sin(now / 120 + k);
      ctx.strokeStyle = `rgba(255,${190 + 40 * a | 0},60,${a})`; ctx.lineWidth = 3; rr(x + 2, PAD + k * cw + 2, cw - 4, cw - 4, 9); ctx.stroke();
    }
  }
  ctx.restore();
  // čáry mezi válci
  ctx.strokeStyle = '#7a4a00'; ctx.lineWidth = 2;
  for (let r = 0; r < COLS; r++) { rr(reelX(r), PAD, cw, ROWS * cw, 10); ctx.stroke(); }
  // flash
  if (flash > 0) { ctx.fillStyle = `rgba(255,230,150,${flash * 0.5})`; ctx.fillRect(0, 0, W, H); }
  // částice
  for (const p of parts) { ctx.globalAlpha = Math.max(0, p.l); ctx.fillStyle = p.c; ctx.font = `${p.s}px ${FONT}`; ctx.textAlign = 'center'; if (p.t) ctx.fillText(p.t, p.x, p.y); else ctx.fillRect(p.x, p.y, p.s, p.s * 0.6); }
  ctx.globalAlpha = 1;
  // nápis
  if (banner) {
    const k = banner.t, a = Math.min(1, k * 4, (banner.d - k) * 3), sc = 0.85 + 0.2 * Math.sin(Math.min(1, k * 3) * 1.57);
    ctx.save(); ctx.globalAlpha = Math.max(0, a); ctx.translate(W / 2, H / 2); ctx.scale(sc, sc); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `900 ${W * 0.12}px system-ui, sans-serif`; ctx.lineWidth = 8; ctx.strokeStyle = '#5a2a00'; ctx.strokeText(banner.txt, 0, 0);
    const tg = ctx.createLinearGradient(0, -30, 0, 30); tg.addColorStop(0, '#fff4b0'); tg.addColorStop(1, banner.col || '#ffb300'); ctx.fillStyle = tg; ctx.fillText(banner.txt, 0, 0);
    if (banner.sub) { ctx.font = `800 ${W * 0.06}px system-ui, sans-serif`; ctx.lineWidth = 5; ctx.strokeText(banner.sub, 0, W * 0.11); ctx.fillStyle = '#fff'; ctx.fillText(banner.sub, 0, W * 0.11); }
    ctx.restore();
  }
}
function rr(x, y, w, h, r) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }

// ===================== SMYČKA =====================
let last = performance.now(), cbs = [];
function later(ms, fn) { cbs.push({ t: ms / (S.fast ? 2 : 1), fn }); }
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  for (const R of reels) if (R.spinning) {
    const t = (now - R.t0) / 1000 / (S.fast ? 0.5 : 1);
    if (t < 0) continue;
    const p = Math.min(1, t / R.dur);
    R.off = R.from + (R.to - R.from) * easeOut(p);
    const idx = Math.floor(R.off); if (idx !== R.lastTick && p < 0.85) { R.lastTick = idx; if (R === firstSpinning()) sfx.tick(); }
    if (p >= 1) { R.off = R.to; R.spinning = false; R.stopped = true; sfx.stop(reels.indexOf(R)); onReelStop(reels.indexOf(R)); }
  }
  for (let i = cbs.length - 1; i >= 0; i--) { cbs[i].t -= dt * 1000; if (cbs[i].t <= 0) { const f = cbs[i].fn; cbs.splice(i, 1); f(); } }
  if (shake > 0) shake = Math.max(0, shake - dt * 3);
  if (flash > 0) flash = Math.max(0, flash - dt * 2.5);
  if (banner) { banner.t += dt; if (banner.t > banner.d) banner = null; }
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 520 * dt; p.l -= dt * 0.55; if (p.l <= 0) parts.splice(i, 1); }
  tally(dt);
  draw(now);
  requestAnimationFrame(frame);
}
function firstSpinning() { return reels.find(r => r.spinning); }

// ===================== PRŮBĚH KOLA =====================
let shown = { credit: S.credit, win: 0 }, creditTarget = S.credit;
function tally(dt) {
  const d = creditTarget - shown.credit;
  if (d !== 0) { shown.credit += Math.abs(d) < 1 ? d : d * Math.min(1, dt * 7) + Math.sign(d) * 0.01; if (Math.abs(creditTarget - shown.credit) < 1) shown.credit = creditTarget; }
  $('credit').textContent = Math.round(shown.credit).toLocaleString('cs-CZ');
  const wd = S.pending - shown.win;
  if (wd !== 0) { shown.win += Math.abs(wd) < 1 ? wd : wd * Math.min(1, dt * 6) + Math.sign(wd) * 0.05; if (Math.abs(S.pending - shown.win) < 1) shown.win = S.pending; }
  $('winv').textContent = Math.round(shown.win).toLocaleString('cs-CZ');
  $('winBox').classList.toggle('hot', S.pending > 0);
}
function setCredit(v) { S.credit = Math.max(0, v); creditTarget = S.credit; save(); }
function msg(t) { $('msg').textContent = t || ' '; }
function ui() {
  const idle = S.state === 'idle', canGamble = S.state === 'win' && S.pending > 0 && S.gambleSteps < 5;
  $('betv').textContent = S.bet; $('bet2').textContent = S.bet;
  $('spin').textContent = S.state === 'spinning' || S.state === 'respin' ? 'STOP' : 'START';
  $('spin').classList.toggle('stop', S.state === 'spinning' || S.state === 'respin');
  $('spin').disabled = !(idle || S.state === 'win' || S.state === 'spinning');
  $('gambleBtn').disabled = !canGamble; $('collectBtn').disabled = !(S.state === 'win' && S.pending > 0);
  for (const id of ['bm', 'bp', 'maxbet']) $(id).disabled = !(idle || S.state === 'win');
  $('auto').classList.toggle('on', S.auto); $('auto').querySelector('small').textContent = S.auto ? 'zap' : 'vyp';
  $('fast').classList.toggle('on', S.fast); $('fast').querySelector('small').textContent = S.fast ? 'zap' : 'vyp';
  $('snd').querySelector('small').textContent = S.sound ? 'zap' : 'vyp';
}
function collect() {
  if (S.pending > 0) { setCredit(S.credit + S.pending); S.pending = 0; }
  winCells = new Set(); S.gambleSteps = 0; S.state = 'idle'; ui();
}
function startSpin() {
  if (S.state === 'win') collect();
  if (S.state !== 'idle') return;
  if (S.credit < S.bet) { if (S.credit >= BETS[0]) { S.bet = [...BETS].reverse().find(b => b <= S.credit); ui(); } else { broke(); return; } }
  setCredit(S.credit - S.bet); S.respins = 0; winCells = new Set(); shown.win = 0; S.pending = 0;
  for (const R of reels) { R.locked = false; }
  msg(''); S.state = 'spinning'; sfx.btn(); spinReels(false); ui();
}
function spinReels(isRespin) {
  const now = performance.now(); let n = 0;
  reels.forEach((R, r) => {
    if (R.locked) return;
    const fin = pickReel(Math.random), from = Math.round(R.off), turns = (isRespin ? 12 : 16) + n * 5 + (Math.random() * 3 | 0);
    const T = from - turns; for (let k = 0; k < ROWS; k++) R.map.set(T + k, fin[k]);
    R.from = R.off = from; R.to = T; R.t0 = now + n * (S.fast ? 60 : 110); R.dur = (isRespin ? 0.8 : 1.0) + n * 0.26; R.spinning = true; R.stopped = false; R.lastTick = from; n++;
  });
}
function onReelStop(r) {
  if (reels.some(R => R.spinning)) {
    // joker, který dopadl, zvýrazni hned
    if (jokerIn(reels[r]) && !reels[r].locked) { sfx.joker(); flash = 0.35; }
    return;
  }
  if (jokerIn(reels[r]) && !reels[r].locked) { sfx.joker(); flash = 0.35; }
  later(250, afterStop);
}
function jokerIn(R) { for (let k = 0; k < ROWS; k++) if (symAt(R, Math.round(R.off) + k) === JOKER) return true; return false; }
function afterStop() {
  let added = 0;
  reels.forEach(R => { if (!R.locked && jokerIn(R)) { R.locked = true; added++; } });
  if (added && S.respins < MAX_RESPINS && !reels.every(R => R.locked)) {
    S.respins++; S.state = 'respin'; shake = 0.6; banner = { txt: 'RESPIN!', sub: `joker ${S.respins}/${MAX_RESPINS}`, col: '#d98cff', t: 0, d: 0.9 };
    msg('🃏 Joker se zamkl jako wild válec – ostatní se roztočí znovu!'); ui();
    later(950, () => { S.state = 'respin'; spinReels(true); ui(); }); return;
  }
  finish();
}
function finish() {
  const grid = reels.map(R => [0, 1, 2].map(k => symAt(R, Math.round(R.off) + k)));
  const locked = reels.map(R => R.locked);
  const res = evaluate(grid, locked, S.bet);
  if (res.total > 0) {
    S.pending = res.total; winCells = res.cells; S.state = 'win'; S.gambleSteps = 0;
    const best = res.wins.slice().sort((a, b) => b.amt - a.amt)[0];
    msg(`${SYMS[best.s].e} ${best.n}× · ${best.ways} cest${res.wins.length > 1 ? ' + další výhry' : ''}`);
    const ratio = res.total / S.bet;
    if (ratio >= 40) { banner = { txt: 'MEGA WIN', sub: '+' + res.total, col: '#ff7a3a', t: 0, d: 2.4 }; sfx.big(); shake = 1; flash = 0.7; confetti(70); }
    else if (ratio >= 12) { banner = { txt: 'BIG WIN', sub: '+' + res.total, col: '#ffb300', t: 0, d: 1.8 }; sfx.big(); shake = 0.6; confetti(40); }
    else { sfx.win(res.wins.length); if (ratio >= 3) confetti(14); }
    ui();
    // automatické vybrání (nebo okamžitě při autospinu)
    const my = ++S.big; later(S.auto ? 1600 : 4500, () => { if (S.state === 'win' && my === S.big) { collect(); if (S.auto) later(300, startSpin); } });
  } else {
    sfx.lose(); S.state = 'idle'; msg(S.respins ? 'Respiny nic nepřinesly…' : ' '); ui();
    if (S.auto) later(500, startSpin);
  }
  if (S.credit < BETS[0] && S.state === 'idle') broke();
}
function confetti(n) {
  const cols = ['#ffd166', '#ff5a6e', '#6be38a', '#6ab8ff', '#e08cff'], em = ['✨', '⭐', '🍒', '🪙'];
  for (let i = 0; i < n; i++) parts.push({ x: W / 2 + (Math.random() - 0.5) * W * 0.5, y: H * 0.55, vx: (Math.random() - 0.5) * 420, vy: -260 - Math.random() * 320, s: 10 + Math.random() * 14, c: cols[i % 5], l: 1.3 + Math.random() * 0.6, t: null });
}
function broke() {
  S.auto = false; ui();
  openCard(`<h2>Došly kredity 😅</h2><p>Nevadí – je to jen hra. Dobij si virtuálních 5 000 kreditů a jedeš dál.</p><button id="refill">🪙 Dobít 5 000 kreditů</button>`);
  $('refill').onclick = () => { setCredit(5000); closeCard(); S.state = 'idle'; ui(); };
}

// ===================== RIZIKO =====================
let gDraw = null;
function openGamble() {
  if (S.state !== 'win' || S.pending <= 0 || S.gambleSteps >= 5) return;
  S.state = 'gamble'; S.big++; ui(); renderGamble('');
}
let gHist = [];
function renderGamble(res, back = true, shownCard = '') {
  const cardHtml = back ? '<div class="pcard back">🃏</div>' : shownCard;
  openCard(`<h2>🎴 RIZIKO</h2>
    <p style="text-align:center">Hádej barvu karty. Správně = <b>výhra ×2</b>, špatně = o všechno přijdeš.<br>Zbývá pokusů: <b>${5 - S.gambleSteps}</b></p>
    <div style="font-size:28px;font-weight:900;color:var(--gold)">${Math.round(S.pending).toLocaleString('cs-CZ')}</div>
    <small style="opacity:.7">při úspěchu: ${(S.pending * 2).toLocaleString('cs-CZ')}</small>
    <div class="cards">${cardHtml}</div>
    <div class="hist">${gHist.slice(-8).map(c => c === 'r' ? '<span style="color:#e4415a">♥</span>' : '<span>♠</span>').join('')}</div>
    <div id="gmsg" style="min-height:22px;font-weight:800;color:var(--gold)">${res}</div>
    <div class="gbtns"><button class="r" id="gr">♥ ČERVENÁ</button><button class="b" id="gb">♠ ČERNÁ</button></div>
    <button id="gcol" style="background:linear-gradient(#ffd166,#d38b05);color:#3a2400">💰 VYBRAT ${Math.round(S.pending).toLocaleString('cs-CZ')}</button>`);
  $('gr').onclick = () => guess('r'); $('gb').onclick = () => guess('b');
  $('gcol').onclick = () => { closeCard(); collect(); };
}
function guess(c) {
  if (S.state !== 'gamble') return;
  const ans = Math.random() < 0.5 ? 'r' : 'b', suit = ans === 'r' ? ['♥', '♦'][Math.random() * 2 | 0] : ['♠', '♣'][Math.random() * 2 | 0];
  gHist.push(ans); S.state = 'gambleBusy';
  const card = `<div class="pcard ${ans === 'r' ? 'red' : 'blk'}">${suit}</div>`;
  if (ans === c) {
    S.pending *= 2; S.gambleSteps++; sfx.win(3);
    renderGamble('✔ Správně! Výhra zdvojnásobena', false, card);
    setTimeout(() => {
      S.state = 'gamble';
      if (S.gambleSteps >= 5) { closeCard(); S.state = 'win'; msg('Dosažen limit rizika – výhra připsána.'); collect(); }
      else renderGamble('');
    }, 1100);
  } else {
    sfx.lose(); renderGamble('✘ Špatně – výhra propadla', false, card); S.pending = 0;
    setTimeout(() => { closeCard(); S.state = 'win'; collect(); msg('Riziko nevyšlo…'); }, 1400);
  }
}

// ===================== MODÁLNÍ OKNO =====================
function openCard(html) { $('card').innerHTML = html; $('overlay').classList.add('show'); }
function closeCard() { $('overlay').classList.remove('show'); }
function showRules() {
  const rows = SYMS.slice(0, JOKER).map(s => `<tr><td style="font-size:22px">${s.e}</td><td>${(s.p[0] * PAYSCALE * 100).toFixed(0)} %</td><td>${(s.p[1] * PAYSCALE * 100).toFixed(0)} %</td></tr>`).join('');
  openCard(`<h2>Pravidla</h2>
  <table><tr><th></th><th>3 VÁLCE</th><th>4 VÁLCE</th></tr>${rows}</table>
  <p>• <b>81 výherních cest</b> (3 řádky ^ 4 válce): symboly musí jít zleva za sebou na sousedních válcích, minimálně 3. Výhra = hodnota × stávka × počet cest.</p>
  <p>• 🃏 <b>Joker</b> je wild a nahrazuje všechny symboly.</p>
  <p>• <b>Respin:</b> když dopadne joker, jeho válec se zamkne jako celý wild a ostatní válce se roztočí znovu. Až ${MAX_RESPINS}× za sebou!</p>
  <p>• 🎴 <b>Riziko:</b> po výhře hádej barvu karty, až 5×. Špatně = přijdeš o výhru.</p>
  <p>• Klepnutím na plátno nebo STOP zastavíš točení. AUTO se točí samo.</p>
  <p style="text-align:center;opacity:.7">Pouze zábava, virtuální kredity bez hodnoty.</p>
  <button id="cl">Zavřít</button>`);
  $('cl').onclick = closeCard;
}

// ===================== OVLÁDÁNÍ =====================
function stopNow() {
  if (S.state !== 'spinning' && S.state !== 'respin') return;
  for (const R of reels) if (R.spinning) { R.t0 -= 1e6; }
}
$('spin').onclick = () => { if (S.state === 'spinning' || S.state === 'respin') stopNow(); else startSpin(); };
cv.onclick = () => { if (S.state === 'spinning' || S.state === 'respin') stopNow(); };
$('gambleBtn').onclick = openGamble;
$('collectBtn').onclick = () => { S.big++; collect(); msg(' '); };
$('bm').onclick = () => { const i = BETS.indexOf(S.bet); S.bet = BETS[Math.max(0, i - 1)]; save(); sfx.btn(); ui(); };
$('bp').onclick = () => { const i = BETS.indexOf(S.bet); S.bet = BETS[Math.min(BETS.length - 1, i + 1)]; save(); sfx.btn(); ui(); };
$('maxbet').onclick = () => { S.bet = [...BETS].reverse().find(b => b <= S.credit) || BETS[0]; save(); sfx.btn(); ui(); };
$('auto').onclick = () => { S.auto = !S.auto; ui(); if (S.auto && S.state === 'idle') startSpin(); };
$('fast').onclick = () => { S.fast = !S.fast; save(); ui(); };
$('snd').onclick = () => { S.sound = !S.sound; save(); ui(); sfx.btn(); };
$('info').onclick = showRules;
document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); $('spin').click(); } });
window.addEventListener('resize', resize);
resize(); ui(); requestAnimationFrame(frame);
window.__slot = { S, reels, startSpin, evaluate, playRound, stopNow };
})();
</script>
