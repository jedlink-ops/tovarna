<style>

<body>
<div id="app">
 <div class="cab" id="cab">
  <div class="marq">
    <div class="bulbs" id="bulbsT"></div>
    <h1>OVOCNÝ RESPIN 81<small>81 CEST · RESPIN · FREE SPINY · JACKPOTY</small></h1>

  </div>
  <div class="jps">
    <div class="jp j0" id="jpb0"><span>MINI</span><b id="jp0">0</b></div>

  </div>

    <div class="leds" id="ledL"></div>

  </div>
  <div class="lcd">
    <div class="led"><span>KREDIT</span><b id="credit">0</b></div>
    <div class="led"><span>STÁVKA</span><b id="betv">0</b></div>

  </div>

      <button id="gambleBtn" disabled>🎴 RIZIKO<small>zdvojnásobit</small></button>

      <button id="collectBtn" disabled>💰 VYBRAT<small>výhru</small></button>
      <div class="bet" style="grid-column: 1; grid-row: 2"><button id="bm">−</button><div><b id="bet2">0</b><br><small>STÁVKA</small></div><button id="bp">+</button></div>
      <button id="maxbet" style="grid-column: 3; grid-row: 2">MAX<small>STÁVKA</small></button>
    </div>
    <div class="row2">
      <button id="auto">🔁 AUTO<small>vyp</small></button>
      <button id="fast">⚡ RYCHLE<small>vyp</small></button>

    </div>
  </div>
  <div class="tray"><div></div></div>
 </div>
 <div class="foot">Hra pouze pro zábavu s virtuálními kredity. Žádné skutečné peníze, žádné výhry. 18+</div>
</div>
<div id="overlay"><div id="card"></div></div>

<script>
(() => {
'use strict';
// ===================== LOGIKA (čistá, testovatelná) =====================
// LOGIC START
const COLS = 4, ROWS = 3;
const SYMS = [
  { id: 'cherry',  e: '🍒', w: 22,  p: [0.05, 0.15] },
  { id: 'lemon',   e: '🍋', w: 22,  p: [0.05, 0.15] },
  { id: 'orange',  e: '🍊', w: 18,  p: [0.08, 0.25] },
  { id: 'grape',   e: '🍇', w: 16,  p: [0.08, 0.25] },
  { id: 'melon',   e: '🍉', w: 12,  p: [0.12, 0.40] },
  { id: 'bell',    e: '🔔', w: 9,   p: [0.25, 0.80] },
  { id: 'seven',   e: '7️⃣', w: 5,   p: [0.50, 2.00] },
  { id: 'joker',   e: '🃏', w: 2,   p: null },
  { id: 'scatter', e: '⭐', w: 3.5, p: null },
];
const JOKER = 7, SCATTER = 8, MAX_RESPINS = 3, FREE_MULT = 2;
const TOTAL_W = SYMS.reduce((a, s) => a + s.w, 0);
const scatPay = n => n >= 6 ? 40 : n === 5 ? 15 : n === 4 ? 6 : n === 3 ? 2 : 0;
const freeSpinsFor = n => n >= 5 ? 20 : n === 4 ? 12 : 8;
function pickSym(rnd) { let r = rnd() * TOTAL_W; for (let i = 0; i < SYMS.length; i++) { r -= SYMS[i].w; if (r < 0) return i; } return 0; }
function pickReel(rnd) { return [pickSym(rnd), pickSym(rnd), pickSym(rnd)]; }
// grid[r] = [řádek0, řádek1, řádek2]; locked[r] = true => celý válec je wild joker
function evaluate(grid, locked, bet) {
  let total = 0; const wins = [], cells = new Set();
  for (let s = 0; s < JOKER; s++) {
    const cnt = [];
    for (let r = 0; r < COLS; r++) { let c = 0; if (locked[r]) c = ROWS; else for (let k = 0; k < ROWS; k++) if (grid[r][k] === s || grid[r][k] === JOKER) c++; cnt.push(c); }
    let n = 0, ways = 1;
    while (n < COLS && cnt[n] > 0) { ways *= cnt[n]; n++; }
    if (n >= 3) {
      const amt = Math.max(1, Math.round(bet * SYMS[s].p[n - 3] * ways * PAYSCALE));
      total += amt; wins.push({ s, n, ways, amt });
      for (let r = 0; r < n; r++) for (let k = 0; k < ROWS; k++) if (locked[r] || grid[r][k] === s || grid[r][k] === JOKER) cells.add(r + ',' + k);
    }
  }
  let scat = 0; const sc = [];
  for (let r = 0; r < COLS; r++) if (!locked[r]) for (let k = 0; k < ROWS; k++) if (grid[r][k] === SCATTER) { scat++; sc.push(r + ',' + k); }
  if (scat >= 3) { const amt = Math.round(bet * scatPay(scat)); total += amt; wins.push({ s: SCATTER, n: scat, ways: 1, amt }); sc.forEach(c => cells.add(c)); }
  return { total, wins, cells, scat };
}
const PAYSCALE = 1.18;
// jedno kolo včetně respinů
function playRound(rnd, bet) {
  const grid = [], locked = [false, false, false, false];
  for (let r = 0; r < COLS; r++) grid.push(pickReel(rnd));
  let respins = 0;
  for (;;) {
    let added = false;
    for (let r = 0; r < COLS; r++) if (!locked[r] && grid[r].includes(JOKER)) { locked[r] = true; added = true; }
    if (!added || respins >= MAX_RESPINS || locked.every(Boolean)) break;
    respins++;
    for (let r = 0; r < COLS; r++) if (!locked[r]) grid[r] = pickReel(rnd);
  }
  return { grid, locked, respins, ...evaluate(grid, locked, bet) };
}
// placené kolo + případné free spiny (pro simulaci RTP)
function playFull(rnd, bet) {
  const r = playRound(rnd, bet); let total = r.total, free = r.scat >= 3 ? freeSpinsFor(r.scat) : 0, n = 0;
  while (free > 0 && n < 300) { free--; n++; const q = playRound(rnd, bet); total += q.total * FREE_MULT; if (q.scat >= 3) free += freeSpinsFor(q.scat); }
  return { total, freeSpins: n, base: r.total, triggered: r.scat >= 3 };
}
// jackpoty: poolu v násobcích sázky; 2 % sázek se rozdělí do 4 úrovní
const JP_SEED = [10, 50, 200, 1000], JP_SHARE = [0.4, 0.3, 0.2, 0.1], JP_RATE = 0.02, JP_P = [1 / 2000, 1 / 8000, 1 / 30000, 1 / 120000];
// LOGIC END

if (typeof window === 'undefined') { module.exports = { playRound, playFull, SYMS, evaluate }; return; }

// ===================== STAV =====================
const BETS = [10, 20, 50, 100, 200, 500];
const JP_NAMES = ['MINI', 'MINOR', 'MAJOR', 'GRAND'];
const $ = id => document.getElementById(id);
const S = { credit: 5000, bet: 20, pending: 0, auto: false, fast: false, sound: true, state: 'idle', respins: 0, gambleSteps: 0, big: 0, free: null, next: null,
  jp: JP_SEED.slice(), stats: { spins: 0, wagered: 0, won: 0, best: 0, fs: 0, jp: 0, respins: 0 }, hist: [] };
try {
  const d = JSON.parse(localStorage.getItem('automat81b') || 'null');
  if (d) { S.credit = d.credit; S.bet = BETS.includes(d.bet) ? d.bet : 20; S.sound = d.sound !== false; S.fast = !!d.fast; if (Array.isArray(d.jp) && d.jp.length === 4) S.jp = d.jp; if (d.stats) Object.assign(S.stats, d.stats); if (Array.isArray(d.hist)) S.hist = d.hist; }
} catch (e) {}
function save() { try { localStorage.setItem('automat81b', JSON.stringify({ credit: S.credit, bet: S.bet, sound: S.sound, fast: S.fast, jp: S.jp, stats: S.stats, hist: S.hist.slice(-30) })); } catch (e) {} }

// ===================== ZVUK (zvonky, dozvuk, mechanika válců) =====================
let AC = null, MASTER = null, REV = null, NOISE = null, LOOP = null;
function audio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return AC; }
  AC = new (window.AudioContext || window.webkitAudioContext)();
  const comp = AC.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 4; comp.connect(AC.destination);
  MASTER = AC.createGain(); MASTER.gain.value = 0.55; MASTER.connect(comp);
  const d = AC.createDelay(); d.delayTime.value = 0.11; const fb = AC.createGain(); fb.gain.value = 0.38; const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
  REV = AC.createGain(); REV.gain.value = 0.4; REV.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(comp);
  const len = AC.sampleRate; NOISE = AC.createBuffer(1, len, AC.sampleRate); const ch = NOISE.getChannelData(0); for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
  return AC;
}
function env(g, t, a, d, vol) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
function bell(f, when, vol, dur) {
  if (!S.sound) return;
  try {
    audio(); const t = AC.currentTime + (when || 0), d = dur || 0.9, g = AC.createGain(); g.connect(MASTER); g.connect(REV);
    env(g, t, 0.004, d, vol || 0.12);
    for (const [m, v, dd] of [[1, 1, 1], [2.756, 0.28, 0.45], [5.4, 0.1, 0.2], [0.5, 0.35, 0.8]]) { const o = AC.createOscillator(), og = AC.createGain(); o.type = 'sine'; o.frequency.value = f * m; og.gain.setValueAtTime(v, t); og.gain.exponentialRampToValueAtTime(0.001, t + d * dd); o.connect(og); og.connect(g); o.start(t); o.stop(t + d + 0.05); }
  } catch (e) {}
}
function tone(f, dur, type, vol, when, f2) {
  if (!S.sound) return;

    body = S.hist.length ? '<table><tr><th>#</th><th>STÁVKA</th><th>VÝHRA</th></tr>' + S.hist.slice().reverse().map((h, i) => `<tr><td>${S.hist.length - i}</td><td>${h[2] ? 'free' : h[0]}</td><td style="color:${h[1] ? '#ffd166' : '#ffffff77'}">${h[1] ? '+' + fmt(h[1]) : '0'}</td></tr>`).join('') + '</table>' : '<p>Zatím žádná kola.</p>';
  }
  openCard(`<h2>Menu</h2><div class="tabs">${tabs.map((t, i) => `<button class="${i === tab ? 'on' : ''}" data-t="${i}">${t}</button>`).join('')}</div>${body}<button id="cl">Zavřít</button>`);
  $('cl').onclick = closeCard;
  $('card').querySelectorAll('.tabs button').forEach(b => b.onclick = () => menu(+b.dataset.t));
  const rs = $('reset'); if (rs) rs.onclick = () => { S.stats = { spins: 0, wagered: 0, won: 0, best: 0, fs: 0, jp: 0, respins: 0 }; S.hist = []; S.jp = JP_SEED.slice(); setCredit(5000); closeCard(); ui(); };
}
const RTP_TXT = '96';

// ===================== OVLÁDÁNÍ =====================
function stopNow() {
  if (S.state !== 'spinning' && S.state !== 'respin') return;
  for (const R of reels) if (R.spinning) { R.t0 -= 1e6; R.antic = false; }
}
$('spin').onclick = () => { if (S.state === 'spinning' || S.state === 'respin') stopNow(); else startSpin(); };
cv.onclick = () => { if (S.state === 'spinning' || S.state === 'respin') stopNow(); };
$('gambleBtn').onclick = openGamble;
$('collectBtn').onclick = () => { S.big++; collect(); msg(' '); };
$('bm').onclick = () => { const i = BETS.indexOf(S.bet); S.bet = BETS[Math.max(0, i - 1)]; save(); sfx.btn(); ui(); };
$('bp').onclick = () => { const i = BETS.indexOf(S.bet); S.bet = BETS[Math.min(BETS.length - 1, i + 1)]; save(); sfx.btn(); ui(); };
$('maxbet').onclick = () => { S.bet = [...BETS].reverse().find(b => b <= S.credit) || BETS[0]; save(); sfx.btn(); ui(); };
$('auto').onclick = () => { S.auto = !S.auto; ui(); if (S.auto && S.state === 'idle' && !S.free) startSpin(); };
$('fast').onclick = () => { S.fast = !S.fast; save(); ui(); };
$('snd').onclick = () => { S.sound = !S.sound; if (!S.sound) loopOff(); save(); ui(); sfx.btn(); };
$('info').onclick = () => menu(0);
document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); $('spin').click(); } });
window.addEventListener('resize', resize);
// žárovky a LED proužky
for (const id of ['bulbsT', 'bulbsB']) $(id).innerHTML = '<i></i>'.repeat(22);
for (const id of ['ledL', 'ledR']) $(id).innerHTML = '<i></i>'.repeat(14);
resize(); ui(); requestAnimationFrame(frame);
window.__slot = { sfx, S, reels, startSpin, evaluate, playRound, stopNow, doJackpot, proceed, finish, menu };
})();
</script>
